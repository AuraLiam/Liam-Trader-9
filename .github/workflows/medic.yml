# ایجنت نگهبان — هر ۱۵ دقیقه پنل را از بیرون معاینه می‌کند و ضربان خوابیده را
# خودش بیدار می‌کند.
#
# چرا جدا از ضربان: ضربان خودش بیمار محتمل است — نگهبانی که داخل بیمار زندگی
# کند با او می‌میرد. این ورک‌فلو سبک است (زیر یک دقیقه)، هیچ وابستگی به کد
# چرخه ندارد، و فقط همان فایل‌هایی را می‌خواند که مرورگر حمید می‌خواند.
#
# کرون گیت‌هاب بعضی شلیک‌ها را می‌اندازد (اندازه‌گیری شده در heartbeat.yml).
# برای نگهبان این قابل تحمل است: از ۴ شلیک ساعت اگر یکی هم برسد، خرابی حداکثر
# یک ساعت بی‌درمان می‌ماند نه دو روز. لایهٔ بیرونی (n8n) و مرور دوره‌ای کلود
# بقیهٔ پوشش‌اند.
name: Fault-finder repairman

on:
  workflow_dispatch:
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write
  actions: write        # برای بیدار کردن ضربان با workflow_dispatch

concurrency:
  group: medic
  cancel-in-progress: true

jobs:
  examine:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: معاینه و در صورت نیاز درمان
        id: medic
        env:
          REVIVE: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set +e
          python3 claude-liam-signal/python/medic.py
          echo "sick=$?" >> "$GITHUB_OUTPUT"
          exit 0

      - name: ثبت وضعیت، فقط اگر عوض شده
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          # git diff فایل untracked را «بدون تغییر» می‌بیند — اولین اجرا همین‌طور
          # بی‌صدا از دست رفت. اول add، بعد مقایسه با ایندکس.
          git add brain/memory/ 2>/dev/null || true
          for _f in brain/medic.json brain/medic-questions.jsonl; do [ -f "$_f" ] && git add "$_f"; done
          if ! git diff --cached --quiet 2>/dev/null; then
            git commit -m "عیب‌یاب: وضعیت عوض شد $(date -u '+%Y-%m-%d %H:%M UTC')"
            # ضربان هم به main پوش می‌کند؛ چند بار تلاش با ریبیس، بعد رها کن —
            # وضعیت در اجرای بعدی دوباره نوشته می‌شود، گم نمی‌شود.
            for i in 1 2 3 4 5 6 7 8; do
              git push origin HEAD:main && break
              git pull --rebase origin main || true
              sleep $((i * 4 + RANDOM % 7))
            done
          fi

      # ۲۳ اوت: پیام قبلی هر ۱۵ دقیقه **همهٔ** یافته‌ها را می‌فرستاد — شش خط
      # «سالم» و خبر واقعی خط هشتم. زنجیرهٔ سیگنال ۸ ساعت مرده بود و همان
      # پیامِ یک‌شکل ده‌ها بار رفت؛ آلارمی که تکرار یکنواخت شود دیگر آلارم
      # نیست (قانون E23: routine still-alive spam ممنوع). حالا medic خودش
      # تصمیم می‌گیرد — تازه‌خراب / هنوز‌خراب (ساعتی) / رفع‌شد — و متن
      # خبرمحور را در فایل می‌گذارد. نبودِ فایل یعنی چیزی برای گفتن نیست.
      - name: هشدار تلگرام — فقط تغییر وضعیت یا یادآوری ساعتی
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          [ -f signals/medic-alert.txt ] || { echo "چیزی برای اعلام نیست"; exit 0; }
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "تلگرام وصل نیست"; exit 0; }
          python3 - <<'EOF'
          import json, os, sys, urllib.request
          text = open("signals/medic-alert.txt", encoding="utf-8").read()
          req = urllib.request.Request(
              f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage",
              data=json.dumps({"chat_id": os.environ["TELEGRAM_CHAT_ID"],
                               "text": text}).encode(),
              headers={"Content-Type": "application/json"}, method="POST")
          # نتیجه بلعیده نمی‌شود: آلارمِ نرسیده باید دیده شود، وگرنه دوباره
          # همان حالتی می‌شود که ۸ ساعت کسی خبردار نشد.
          try:
              r = urllib.request.urlopen(req, timeout=20)
              print(f"آلارم رفت (HTTP {r.status})")
          except Exception as e:
              print(f"::warning::آلارم نرفت — {type(e).__name__}: {e}")
          EOF
          rm -f signals/medic-alert.txt
