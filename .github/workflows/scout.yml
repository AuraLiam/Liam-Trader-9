# گشت چندصرافی — واچ‌لیست روز (دستور حمید، ۲۶ اوت)
#
# همان کاری که حمید اول هر نشست می‌کند: گینر/لوزر/حجم چند صرافی +
# کوین‌گکو، میانگین رتبه، حداقل ۲ منبع بر هر ردیف. خروجی فقط
# signals/watchlist.json است — تلگرام نمی‌فرستد، خوراک اتاق‌هاست.
name: Scout (watchlist)

on:
  workflow_dispatch:
  schedule:
    - cron: "11,41 * * * *"

permissions:
  contents: write

concurrency:
  group: scout
  cancel-in-progress: false

jobs:
  scout:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: آزمون آفلاین
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_scout_basemap
      - name: گشت
        id: run
        continue-on-error: true
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.scout
      # اجرای زمان‌بندی‌شده که شبکه/منبع نداشت، بی‌صدا تمام می‌شود
      # (ایمیل خرابی نسازد)؛ اجرای دستی بلند شکست می‌خورد.
      - name: شکست گشت (فقط اجرای دستی بلند)
        if: steps.run.outcome == 'failure' && github.event_name != 'schedule'
        run: exit 1
      - name: ثبت واچ‌لیست (ضدتصادم)
        if: steps.run.outcome == 'success'
        run: |
          # ناشر مشترک (قانون ۱۴، ۲ سپتامبر) — بدون reset، بدون فهرست سفت
          scripts/publish.sh -m "گشت صرافی‌ها $(date -u +%H:%M) UTC" signals
