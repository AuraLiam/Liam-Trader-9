# جمع‌آوری عمق دفتر بیت‌یونیکس — پیش‌نیاز فعال‌شدن E10.
# دستور حمید (۲۲ اوت): «همین دیتای عمق بیت‌یونیکس رو هم راه بنداز.»
#
# چرا: تأیید خارج از نمونهٔ ۲۲ اوت نشان داد BOS/CHoCH روی ۱-۳ دقیقه با
# کندلِ تنها لبه ندارد (هر ۱۲ خانه CI زیر صفر). قانون ۰۸ از قبل گفته بود
# با کندل نمی‌شود صف/لغو/دیوار را اعتبارسنجی کرد. این ورک‌فلو همان دادهٔ
# گمشده را جمع می‌کند.
#
# حالت probe اول اجرا می‌شود تا مسیر واقعی API کشف شود (حدس ممنوع —
# درس ۲۲ اوت: خطای بی‌جزئیات یعنی هیچ).
name: Depth collect

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (کشف مسیر) یا collect (برداشت)"
        default: "probe"
      symbols:
        description: "نمادها با کاما"
        default: "BTCUSDT,ETHUSDT,SOLUSDT"
      minutes:
        description: "چند دقیقه برداشت"
        default: "20"
      interval:
        description: "فاصلهٔ هر عکس (ثانیه)"
        default: "3"
      path:
        description: "مسیر عمق بعد از کشف (خالی = هنوز کشف نشده)"
        default: ""

permissions:
  contents: write

concurrency:
  group: depth-collect
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Self-test
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_depth_collector
      - name: Probe or collect
        working-directory: claude-liam-signal/python
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.mode || 'probe' }}" = "probe" ]; then
            python3 -m hamid.depth_collector --probe | tee depth.txt
          else
            P=""
            if [ -n "${{ github.event.inputs.path }}" ]; then
              P="--path ${{ github.event.inputs.path }}"
            fi
            python3 -m hamid.depth_collector \
              --symbols "${{ github.event.inputs.symbols }}" \
              --minutes "${{ github.event.inputs.minutes || '20' }}" \
              --interval "${{ github.event.inputs.interval || '3' }}" \
              $P | tee depth.txt
          fi
      - name: Summary
        if: always()
        working-directory: claude-liam-signal/python
        run: |
          { echo '```'; tail -60 depth.txt 2>/dev/null || echo "no output"; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY
      - name: Publish
        if: github.event.inputs.mode == 'collect'
        run: |
          git config user.name "Hamid Signal Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A brain/depth
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "عمق بیت‌یونیکس $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:main && exit 0
            git fetch origin main || true
            git merge --no-edit origin/main || { git merge --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1
