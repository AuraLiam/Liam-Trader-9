# جمع‌آوری عمق دفتر بیت‌یونیکس — پیش‌نیاز فعال‌شدن E10.
# دستور حمید (۲۲ اوت): «همین دیتای عمق بیت‌یونیکس رو هم راه بنداز.»
#
# چرا: تأیید خارج از نمونهٔ ۲۲ اوت نشان داد BOS/CHoCH روی ۱-۳ دقیقه با
# کندلِ تنها لبه ندارد (هر ۱۲ خانه CI زیر صفر). قانون ۰۸ از قبل گفته بود
# با کندل نمی‌شود صف/لغو/دیوار را اعتبارسنجی کرد. این ورک‌فلو همان دادهٔ
# گمشده را جمع می‌کند.
#
# حالت probe اول اجرا می‌شود تا مسیر واقعی API کشف شود (حدس ممنوع —
# درس ۲۲ اوت: خطای بی‌جزئیات یعنی هیچ).
name: Depth collect

on:
  # ساعتی، دقیقهٔ ۱ (فرد و خالی — بقیهٔ کرون‌های ریپو اشغالش نکرده‌اند).
  # ۵۰ دقیقه برداشت یعنی پوشش ~۸۳٪ ساعت با یک جاب. یک‌بار برداشت هیچ
  # حجمی انباشته نمی‌کند؛ سؤال «آیا عمق شکست واقعی را از کاذب جدا می‌کند»
  # به نمونهٔ چندروزه نیاز دارد.
  schedule:
    - cron: "1 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "probe (کشف مسیر) یا collect (برداشت)"
        default: "collect"
      symbols:
        description: "نمادها با کاما"
        default: ""
      minutes:
        description: "چند دقیقه برداشت"
        default: "50"
      interval:
        description: "فاصلهٔ هر عکس (ثانیه)"
        default: "2"
      path:
        description: "مسیر عمق بعد از کشف (خالی = هنوز کشف نشده)"
        default: ""

env:
  # مجموعهٔ ثابت — نه چرخشی. تاریخچهٔ عمق فقط وقتی ارزش دارد که روی
  # همان نماد انباشته شود؛ چرخاندن نمادها داده را تکه‌تکه می‌کند.
  # انتخاب: نقدشوندهٔ بیت‌یونیکس، داخل باند نوسان ۱-۳ دقیقهٔ
  # volatility_universe (زیر باند = دام کارمزد، بالای باند = استاپ بزرگ).
  DEPTH_SYMBOLS: "BTCUSDT,ETHUSDT,SOLUSDT,XRPUSDT,DOGEUSDT,ENAUSDT,ZECUSDT,DASHUSDT"

permissions:
  contents: write

concurrency:
  group: depth-collect
  cancel-in-progress: false

jobs:
  depth:
    runs-on: ubuntu-latest
    # ۵۰ دقیقه برداشت + حاشیه برای نصب و انتشار. هرگز از ۶۰ رد نشود،
    # وگرنه اجرای ساعت بعد پشت این صف می‌کشد (cancel-in-progress: false).
    timeout-minutes: 58
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Self-test
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_depth_collector
      - name: Probe or collect
        working-directory: claude-liam-signal/python
        run: |
          set -o pipefail
          if [ "${{ github.event.inputs.mode || 'collect' }}" = "probe" ]; then
            python3 -m hamid.depth_collector --probe | tee depth.txt
          else
            P=""
            if [ -n "${{ github.event.inputs.path }}" ]; then
              P="--path ${{ github.event.inputs.path }}"
            fi
            SYMS="${{ github.event.inputs.symbols }}"
            [ -n "$SYMS" ] || SYMS="$DEPTH_SYMBOLS"
            python3 -m hamid.depth_collector \
              --symbols "$SYMS" \
              --minutes "${{ github.event.inputs.minutes || '50' }}" \
              --interval "${{ github.event.inputs.interval || '2' }}" \
              $P | tee depth.txt
          fi
      # برداشت‌های پیش از لایهٔ جمع‌بندی خام نوشته شدند — تا زده می‌شوند تا
      # یک فرمت بماند. بعد از خالی شدن، این مرحله بی‌اثر است.
      - name: Fold legacy raw
        if: always() && github.event.inputs.mode != 'probe'
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.depth_collector --fold-raw
      - name: Summary
        if: always()
        working-directory: claude-liam-signal/python
        run: |
          { echo '```'; tail -60 depth.txt 2>/dev/null || echo "no output"; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY
          # انباشت واقعی — نه فرض. اگر یک نماد عقب بماند این‌جا پیداست.
          python3 -m hamid.depth_collector --stats >> $GITHUB_STEP_SUMMARY
      # اجرای زمان‌بندی‌شده inputs ندارد؛ شرط قبلی (`inputs.mode == 'collect'`)
      # یعنی هر اجرای کرون بی‌صدا دادهٔ برداشته را دور می‌ریخت. حالا فقط
      # حالت probe منتشر نمی‌کند.
      - name: Publish
        if: github.event.inputs.mode != 'probe'
        run: |
          git config user.name "Hamid Signal Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A brain/depth
          # فایل سلامت ممکن است نباشد (probe، یا شکست پیش از نوشتن). با
          # `bash -e` یک `git add` روی فایل غایب کل مرحله را می‌کشد — و
          # چون این ورک‌فلو در دروازهٔ خودآزمایی زنجیرهٔ سیگنال هم سنجیده
          # می‌شود، همان یک خط کل زنجیره را قرمز کرد. گارد [ -f اجباری است.
          [ -f signals/depth-health.json ] && git add signals/depth-health.json || true
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "عمق بیت‌یونیکس $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && exit 0
            git fetch origin main || true
            # `--allow-unrelated-histories`: این ریپو واقعاً **دو ریشه** دارد
            # (`git rev-list --max-parents=0` دو کامیت می‌دهد)، پس گیت گاهی
            # «refusing to merge unrelated histories» می‌دهد و آن‌وقت هیچ
            # merge ای در جریان نیست.
            if ! git merge --no-edit --allow-unrelated-histories origin/main; then
              python3 "$GITHUB_WORKSPACE/scripts/resolve_brain_conflicts.py" || true
              # حل‌شده‌ها باید stage شوند، وگرنه commit «چیزی برای کامیت
              # نیست» می‌دهد و دور بعد هم همان.
              git add -A brain signals 2>/dev/null || true
              # هر پاک‌سازی با `|| true`: زیر `bash -e` خطای کشندهٔ
              # `git merge --abort` (وقتی merge ای در جریان نیست) کلِ گام
              # را در **دور اول** می‌کشت و حلقهٔ ۸تایی هرگز دور دوم
              # نمی‌دید. اثبات: اجرای ۳۲۰ چرخه، exit 128 در ۳ ثانیه.
              git commit --no-edit || git merge --abort || true
            fi
            sleep $((attempt * 4 + RANDOM % 7))
          done
          exit 1
