# گزارش کار نوبت‌دار به تلگرام (دستور صریح حمید، ۲۶ اوت عصر:
# «دائم ترید کن و نتیجه و استراتژی‌های جدید رو بگو بهم»)
#
# سه نوبت در روزِ تهران: ۰۹:۰۰ / ۱۶:۰۰ / ۲۲:۰۰. هر گزارش: نتیجهٔ
# دفترهای پیپر پنجرهٔ اخیر + میز استراتژی‌های جدید با حکم CI.
name: Work report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: work-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: آزمون آفلاین
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_work_report
      - name: گزارش و ارسال
        working-directory: claude-liam-signal/python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m hamid.work_report --hours 8 --send
      - name: ثبت گزارش (ضدتصادم)
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          cp signals/work-report.json /tmp/wr.json 2>/dev/null || exit 0
          for i in 1 2 3 4 5 6 7 8; do
            git fetch origin main -q
            git reset --hard origin/main -q
            cp /tmp/wr.json signals/work-report.json
            git add signals
            git diff --cached --quiet && { echo "بدون تغییر"; break; }
            git commit -q -m "گزارش کار $(date -u +%H:%M) UTC"
            git push origin HEAD:main -q && break
            sleep $((i * 4 + RANDOM % 7))
          done
