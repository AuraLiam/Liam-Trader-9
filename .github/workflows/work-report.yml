# گزارش کار نوبت‌دار به تلگرام (دستور صریح حمید، ۲۶ اوت عصر:
# «دائم ترید کن و نتیجه و استراتژی‌های جدید رو بگو بهم»)
#
# سه نوبت در روزِ تهران: ۰۹:۰۰ / ۱۶:۰۰ / ۲۲:۰۰. هر گزارش: نتیجهٔ
# دفترهای پیپر پنجرهٔ اخیر + میز استراتژی‌های جدید با حکم CI.
name: Work report

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5,12,18 * * *"

permissions:
  contents: write

concurrency:
  group: work-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      # پاسبان گزارش کار اسکریپتِ گام ناشر را از همین yml می‌خواند → pyyaml
      # (همان وابستگی‌ای که hamid-cycle و pump-radar هم نصب می‌کنند)
      - name: وابستگی‌ها
        run: pip -q install -r requirements-ci.txt
      - name: آزمون آفلاین
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_work_report
      - name: گزارش و ارسال
        working-directory: claude-liam-signal/python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m hamid.work_report --hours 8 --send
      # تمرکز انجین‌ها + تخصیص بندیت (دستور حمید ۳۱ اوت: «هر بار که گزارش
      # می‌گیری روی نقاط قوت هر انجین تمرکز کن... و با اطلاعات جدید
      # تستشون کن») — بی‌حالت از دفتر بسته بازسازی می‌شود، پس هر گزارش
      # خودکار با دادهٔ تازه است. فقط شاهد/تخصیص پیپر؛ دروازه نیست.
      - name: تمرکز انجین‌ها (بندیت)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.bandit --write || true
      # برنامهٔ درسی روزانه (دستور حمید ۱ سپتامبر): سه منبع برای هر انجین،
      # اولویت با انجینی که کارنامه‌اش قرمز است. `--verify` نرخِ پیگیریِ
      # تخصیصِ دیروز را می‌سنجد — خواندنِ بی‌یافته مطالعه نیست.
      - name: برنامهٔ درسی انجین‌ها
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.curriculum --verify || true
          python3 -m hamid.curriculum --write || true
      # آزمایش نردبان تریل (۱ سپتامبر). یافته: تریل‌ها میانه MFE ‎+۰.۸۵R
      # دیدند و ‎+۰.۰۰R برداشتند. `--bars` بازپخشِ کندل‌به‌کندل روی کندل
      # واقعی است — شبکهٔ نشست‌های محلی به صرافی راه ندارد، پس این‌جا
      # (رانر) اجرا می‌شود. `trail_arms` دفترِ A/B زنده را داوری می‌کند.
      - name: آزمایشگاه و بازوهای تریل
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.trail_lab --bars --write || true
          python3 -m hamid.trail_arms --write || true
      # ۲ سپتامبر: این گام فقط دو فایل (work-report، engine-focus) را از
      # reset نجات می‌داد؛ curriculum.json و trail-arms.json و trail-lab.json
      # که گام‌های بالا می‌نوشتند هر بار دور ریخته می‌شدند — سه اجرای سبزِ
      # ۱ سپتامبر هیچ‌کدام را منتشر نکرد و گذرگاه وضعیت آن‌ها را ۳۱ ساعت
      # کهنه دید. کلاسِ عیب: «تولیدکنندهٔ تازه اضافه شد، ناشر به‌روز نشد».
      # حالا هر فایلِ signals/ که همین اجرا عوض کرده، بی‌فهرست نجات می‌یابد.
      # ناشر مشترک (۲ سپتامبر، دستور حمید «برای همیشه»): یک اسکریپت برای
      # همهٔ ورک‌فلوها، با آزمون رفتاری hamid/test_publish.py.
      - name: ثبت گزارش (ضدتصادم)
        run: scripts/publish.sh -m "گزارش کار $(date -u +%H:%M) UTC" signals
