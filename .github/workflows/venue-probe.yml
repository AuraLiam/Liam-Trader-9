# کاوش منابع کندل — فقط دستی. هیچ‌چیز منتشر نمی‌کند؛ فقط چاپ می‌کند کدام
# صرافی برای BTCUSDT/ETHUSDT کندل سالم می‌دهد و بیت‌یونیکس پرپچوال (صرافی
# اجرا، دستور حمید) دقیقاً چه شکلی برمی‌گرداند. اثبات پارسر روی رانر است،
# چون شبکهٔ نشستِ ساخت به صرافی‌ها نمی‌رسد.
name: Venue probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: کاوش
        working-directory: claude-liam-signal/python
        run: |
          python3 - <<'PY'
          import json, time, urllib.request
          import sources
          # ۱) شکل خامِ بیت‌یونیکس
          try:
              raw = sources._json(sources._bitunix_url("BTCUSDT", "15m", 3))
              print("bitunix raw:", json.dumps(raw)[:400])
          except Exception as e:
              print("bitunix raw FAILED:", type(e).__name__, e)
          # ۲) هر صرافی پرپ جداگانه
          for v in sources.PERP_VENUES:
              t0 = time.time()
              try:
                  rows = v["fetch"]("BTCUSDT", "15m", 420) if v.get("fetch") else v["parse"](sources._json(v["url"]("BTCUSDT", "15m", 420)))
                  ok = sources.sane(rows, 420)
                  print(f"{v['id']}: {len(rows)} rows sane={ok} last={rows[-1][:5] if rows else None} {time.time()-t0:.1f}s")
              except Exception as e:
                  print(f"{v['id']}: FAILED {type(e).__name__}: {e}")
          # ۳) مسیر ترجیحی
          import os
          os.environ["LIAM9_CANDLES"] = "perp"; sources.CANDLE_SOURCE = "perp"
          for sym in ("BTCUSDT", "ETHUSDT", "TRUMPUSDT"):
              try:
                  rows = sources.klines_pref(sym, "15m", 420, quiet=False)
                  print(f"pref {sym}: {len(rows)} rows from {sources.used()}")
              except Exception as e:
                  print(f"pref {sym}: FAILED {e}")
          PY
