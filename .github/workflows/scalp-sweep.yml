# جستجوی هندسهٔ اسکلپ — با تفکیک اجباری جستجو از تأیید.
#
# پرسش حمید (۲۳ اوت): کارمزد و استاپ را چطور حل کنیم؛ کیفیت ورود از
# کندل‌شناسی و BOS/CHoCH ۱ دقیقه؛ افق ۱۵ دقیقه؛ اهرم ۳۰–۶۰.
#
# ۵۴ خانه روی نمونهٔ A جستجو می‌شود و **فقط بهترین خانه، فقط یک بار**،
# روی نمونهٔ B (نمادهای مستقل) تأیید. درس ۲۲ اوت: جستجوی پارامتری
# +۰.۱۲۶R «کشف» کرد و خارج از نمونه هر ۱۲ خانه رد شد.
name: Scalp sweep

on:
  workflow_dispatch:
    inputs:
      bars:
        description: "کندل ۱ دقیقه در هر نماد"
        default: "1500"
      symbols:
        description: "تعداد نماد (نصف A، نصف B)"
        default: "200"

permissions:
  contents: write

concurrency:
  group: scalp-sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Self-test
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.test_scalp_sweep
          python3 -m hamid.test_scalp_report
      - name: Sweep
        working-directory: claude-liam-signal/python
        run: |
          set -o pipefail
          python3 -m hamid.scalp_sweep \
            --bars "${{ github.event.inputs.bars || '1500' }}" \
            --symbols "${{ github.event.inputs.symbols || '60' }}" \
            | tee sweep.txt
      - name: Summary
        if: always()
        working-directory: claude-liam-signal/python
        run: |
          { echo '```'; tail -40 sweep.txt 2>/dev/null || echo "no output";
            echo '```'; } >> $GITHUB_STEP_SUMMARY
      - name: Publish
        if: always()
        run: |
          git config user.name "Hamid Signal Agent"
          git config user.email "actions@users.noreply.github.com"
          [ -f signals/scalp-sweep.json ] && git add signals/scalp-sweep.json || true
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "جستجوی هندسهٔ اسکلپ $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && exit 0
            git fetch origin main || true
            # `--allow-unrelated-histories`: این ریپو واقعاً **دو ریشه** دارد
            # (`git rev-list --max-parents=0` دو کامیت می‌دهد)، پس گیت گاهی
            # «refusing to merge unrelated histories» می‌دهد و آن‌وقت هیچ
            # merge ای در جریان نیست.
            if ! git merge --no-edit --allow-unrelated-histories origin/main; then
              python3 "$GITHUB_WORKSPACE/scripts/resolve_brain_conflicts.py" || true
              # حل‌شده‌ها باید stage شوند، وگرنه commit «چیزی برای کامیت
              # نیست» می‌دهد و دور بعد هم همان.
              git add -A brain signals 2>/dev/null || true
              # هر پاک‌سازی با `|| true`: زیر `bash -e` خطای کشندهٔ
              # `git merge --abort` (وقتی merge ای در جریان نیست) کلِ گام
              # را در **دور اول** می‌کشت و حلقهٔ ۸تایی هرگز دور دوم
              # نمی‌دید. اثبات: اجرای ۳۲۰ چرخه، exit 128 در ۳ ثانیه.
              git commit --no-edit || git merge --abort || true
            fi
            sleep $((attempt * 4 + RANDOM % 7))
          done
          exit 1
