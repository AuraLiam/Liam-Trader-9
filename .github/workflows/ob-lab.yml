# آزمایشگاه اردر بلاک — بک‌تستِ دو یافتهٔ ممیزی (دستور حمید، ۹ سپتامبر:
# «هر دو یافتهٔ اردر بلاک رو بک‌تست بگیر»)
#
# چهار بازو روی **همان** کندل‌ها:
#   base    — پرواکنش‌ترین باکس، بی شرطِ رنگ (رفتار امروز)
#   nearest — نزدیک‌ترین باکس
#   colored — شرطِ رنگِ متنِ حمید (ریزش → کندلِ سبز)
#   both    — هر دو
#
# جمعیتِ مرجعِ حکم فقط ستاپِ `ob_pullback` است؛ شاخهٔ `bos_continuation`
# باکس نمی‌بیند و اگر در مخرج بیاید اختلاف را رقیق می‌کند (این را اجرای
# خشکِ محلی نشان داد، پیش از این‌که وقتِ رانر تلف شود).
#
# حکم با قاعدهٔ توقفِ از پیش ثبت‌شده: PROMOTE_CANDIDATE فقط با CI بالای
# صفر در آستانهٔ Šidák، n≥۲۰۰ و نرخِ تغییرِ ≥۱۰٪. PROMOTE = **پیشنهاد**؛
# پیش‌فرضِ `orderblocks` فقط با تأیید صریح حمید عوض می‌شود (قانون ۰۳/۱۲).
name: Order block lab (A/B)

on:
  workflow_dispatch:
    inputs:
      universe:
        description: "N نمادِ برتر به حجم (پیش‌فرض ۱۰۰)"
        default: "100"
      bars:
        description: "کندل بر نماد (پیش‌فرض ۲۰۰۰۰ ≈ ۷ ماهِ ۱۵د)"
        default: "20000"

permissions:
  contents: write
  actions: read

concurrency:
  group: ob-lab
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip -q install -r requirements-ci.txt
      - name: آزمون آفلاین
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.ob_lab --selftest
          python3 -m hamid.test_orderblocks
          python3 -m hamid.test_trainer
          python3 -m hamid.test_state_bus

  shard:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip -q install -r requirements-ci.txt
      - name: اجرای تکه
        working-directory: claude-liam-signal/python
        env:
          LIAM9_CANDLES: perp
        run: |
          mkdir -p /tmp/obl
          python3 -m hamid.ob_lab \
            --universe ${{ github.event.inputs.universe || '100' }} \
            --bars ${{ github.event.inputs.bars || '20000' }} \
            --shard ${{ matrix.shard }} --shards 8 \
            --out /tmp/obl/shard${{ matrix.shard }}.json
      - uses: actions/upload-artifact@v4
        with:
          name: ob-lab-shard-${{ matrix.shard }}
          path: /tmp/obl/shard${{ matrix.shard }}.json
          retention-days: 7

  merge:
    needs: shard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip -q install -r requirements-ci.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: ob-lab-shard-*
          path: /tmp/obl
          merge-multiple: true
      - name: ادغام و حکم
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.ob_lab --merge /tmp/obl/*.json
      - name: اثباتِ خروجی
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          p = pathlib.Path("signals/ob-lab.json")
          if not p.exists():
              sys.exit("ob-lab.json ساخته نشد")
          d = json.loads(p.read_text(encoding="utf-8"))
          # شرطِ پایانی روی **محصول** (درس ۶ سپتامبر): وجودِ فایل کافی نیست.
          assert d.get("population") == "ob_pullback", d.get("population")
          assert set(d.get("vs_base") or {}) == {"nearest", "colored", "both"}, \
              sorted(d.get("vs_base") or {})
          for a, v in d["vs_base"].items():
              assert v["verdict"] in ("PROMOTE_CANDIDATE", "REJECT",
                                      "UNDECIDED"), (a, v["verdict"])
          for a, v in d["vs_base"].items():
              print(f"{a}: n={v['n_arm']} تغییر={v['changed_pct']}% "
                    f"اختلاف={v['diff']} CI={v['ci']} → {v['verdict']}")
          print("پوشش:", d.get("n_symbols"), "نماد ·", d.get("n_skipped"),
                "ردشده · بازه", d.get("span"))
          PY
      - name: انتشار (ناشر مشترک، قانون ۱۴)
        run: scripts/publish.sh -m "آزمایشگاه اردر بلاک $(date -u +%Y-%m-%d)" signals
