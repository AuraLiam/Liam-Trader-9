# چرخهٔ روش حمید — در ابر، چه پنل باز باشد چه نباشد.
#
# Hamid asked for the analysis to keep running when the panel is closed, and for
# one Python command to wake the rooms. `hamid.cycle` is that command; this is
# the clock behind it.
#
# It interleaves with live-scan.yml (which runs at :07 and :37) so the two are
# not competing for the same minute and the pipeline touches the market four
# times an hour rather than two.
#
# The cycle decides for itself whether the day is active or quiet — measured
# from Bitcoin's own ATR, not read off the calendar, because a Saturday during
# a crash is not a quiet day. On a quiet day it reads the economic calendar and
# screens for turnover instead of hunting entries, which is what Hamid asked
# for: «در روزهای تعطیل … تقویم اقتصادی و خبرهای سیاسی مهم هستند».
name: Hamid cycle

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "auto | active | quiet"
        default: auto
      symbols:
        description: "how many coins"
        default: "200"
  schedule:
    # Explicit minutes, not */30. A `*/N` cron lands in the most contended
    # window on the runners and this pipeline has already watched one of them
    # fail to fire for an hour straight.
    - cron: "17,47 * * * *"
  # راه‌انداز «push» عمداً برداشته شد.
  #
  # هر کامیت، سه‌چهار ورک‌فلوی سنگین را با هم روشن می‌کرد. آن‌ها همدیگر را کنسل
  # می‌کردند و — مهم‌تر — زمان‌بند گیت‌هاب روی مخزنی که این‌قدر شلوغ باشد اجراهای
  # کرون را می‌اندازد. اندازه‌گیری شد: بین ۲۳:۳۷ تا ۰۲:۰۶ هیچ اجرای زمان‌بندی‌شده‌ای
  # انجام نشد، در حالی که همان ورک‌فلو قبلش ساعتی یک بار می‌آمد.
  #
  # وقتی لازم بود که کارها روی شاخه بودند و کرون از شاخهٔ غیر‌اصلی شلیک نمی‌کند.
  # حالا همه روی main هستند. برای اجرای دستی، workflow_dispatch هست.

permissions:
  contents: write
  actions: write        # برای dispatch بازانتشار Pages بعد از پوش gh-pages

concurrency:
  group: hamid-cycle
  cancel-in-progress: false

# برند پیام‌ها از منبع مرکزی telegram.PANEL_NAME می‌آید («لیام تریدر ۹»)؛
# override محیطی عمداً حذف شد تا برند فقط یک‌جا تعریف باشد.
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # وابستگی‌ها قبل از خودآزمایی — test_learning به pyyaml نیاز دارد و
      # چارت به matplotlib؛ pip بعد از تست یعنی تست سرخ الکی روی رانر.
      - name: وابستگی‌های پایتون
        run: pip -q install -r requirements-ci.txt

      - name: Method self-check
        # The method's own tests run before it is allowed to produce a signal.
        # These are cheap and they catch the failure mode that matters here: a
        # level engine that is subtly wrong does not crash, it just draws lines
        # somewhere else and keeps going.
        #
        # LIAM9_SANDBOX=1: پاسبان حق نوشتن روی دفترِ تولید ندارد (۴ سپتامبر).
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.selfcheck
          python3 -m hamid.test_patterns
          python3 -m hamid.test_orderblocks
          python3 -m hamid.test_ob_intel
          python3 -m hamid.test_deep
          python3 -m hamid.test_learning
          python3 -m hamid.test_fixit
          python3 -m hamid.test_trainer
          python3 -m hamid.test_pump_study
          python3 -m hamid.test_pump_rules
          python3 -m hamid.test_venues
          python3 -m hamid.test_classify
          python3 -m hamid.test_live_send
          python3 -m hamid.test_always_learning
          python3 -m hamid.test_trendline
          python3 -m hamid.test_levels_db
          python3 -m hamid.test_single_bot
          python3 -m hamid.test_exec_contract
          python3 -m hamid.test_trail_arms
          python3 -m hamid.test_gate_verdict
          python3 -m hamid.test_signal_audit
          python3 -m hamid.test_dash_backtest
          python3 -m hamid.test_publish_top_liquidity
          python3 -m hamid.test_pump_budget
          python3 -m hamid.test_sentinel
          python3 -m hamid.test_scalp_dash_backtest
          python3 -m hamid.test_signal_flow
          python3 -m hamid.test_telegram_dedupe
          python3 -m hamid.test_telegram_feed
          python3 -m hamid.test_state_bus
          python3 -m hamid.test_loop_audit
          python3 -m hamid.test_daily_24
          python3 -m hamid.test_fomo
          python3 -m hamid.test_news_poll
          python3 -m hamid.test_candle_source
          python3 -m hamid.test_shadow_service
          python3 -m hamid.test_phoenix
          python3 -m hamid.test_router
          python3 -m hamid.test_lines_wf
          python3 -m hamid.test_structure_room
          python3 -m hamid.test_newsboard
          python3 -m hamid.test_council
          python3 -m hamid.test_risk_desk
          python3 -m hamid.test_brand
          python3 -m hamid.test_skill_ledger
          python3 -m hamid.test_guardian_lab
          python3 -m hamid.test_dominance_desk
          python3 -m hamid.test_spec_check
          python3 -m hamid.test_dashboard_build
          python3 -m hamid.test_dash_silence
          python3 -m hamid.test_exec_feed
          python3 -m hamid.test_scan_breadth
          python3 -m hamid.test_strategy_priority
          python3 -m hamid.test_receipts_guard
          python3 -m hamid.test_panel_contract
          python3 -m hamid.test_big_money
          python3 -m hamid.test_big_money_backtest
          python3 -m hamid.test_microstructure
          python3 -m hamid.test_scenario_backtest
          python3 -m hamid.test_depth_collector
          python3 -m hamid.test_depth_bos
          python3 -m hamid.test_library_verify
          python3 -m hamid.test_medic_alert
          python3 -m hamid.test_scalp_report
          python3 -m hamid.test_venue_probe
          python3 -m hamid.test_scalp_sweep
          python3 -m hamid.test_position_watch
          python3 -m hamid.test_skill_injection
          python3 -m hamid.test_alert_gate
          python3 -m hamid.test_experience_effect
          python3 -m hamid.test_order_ticket
          python3 -m hamid.test_work_report
          python3 -m hamid.test_paper_dedupe
          python3 -m hamid.test_edge_export
          python3 -m hamid.test_agent_scores
          python3 -m hamid.test_trail_alert
          python3 -m hamid.test_polymarket
          python3 -m hamid.test_escalation

      # ابزارِ کنارِ خط تولید — نه خودِ خط تولید.
      #
      # ۱۵ اوت: آزمونِ ابزارِ merge به فایل‌های واقعیِ brain نگاه می‌کرد، اولین
      # فایل تازه‌ای که خط تولید ساخت قرمزش کرد، و چون داخل همین دروازه بود
      # چرخه ۱۲ بار پشت‌سرهم نرسید و سه ساعت سیگنالِ حمید قطع شد.
      #
      # شکستِ این‌ها یعنی «ابزار merge ایراد دارد»، نه «سیگنال غلط می‌شود».
      # پس هنوز اجرا و دیده می‌شوند، ولی جلوی تحلیل بازار را نمی‌گیرند.
      - name: آزمون ابزارها (شکستش چرخه را نمی‌خواباند)
        continue-on-error: true
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.test_resolve
          python3 -m hamid.test_publish
          python3 -m hamid.test_fill_books
          python3 -m hamid.test_workflows

      # بدون این، _tg_chart بی‌صدا شکست می‌خورد و سیگنال «بدون چارت» می‌رفت —
      # همان چیزی که حمید دید. چارت اجباری است، متنِ خالی فقط آخرین پناه.
      - name: matplotlib برای چارت سیگنال
        run: pip -q install -r requirements-ci.txt

      - name: Run the cycle
        working-directory: claude-liam-signal/python
        env:
          # Without these two the cycle computes signals and delivers them
          # nowhere. telegram.py refuses loudly and sends nothing when they are
          # empty, so the job is safe to run before they exist — but leaving
          # them out of the workflow entirely meant adding the secrets would
          # have changed nothing, silently.
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          CONTEXT7_API_KEY: ${{ secrets.CONTEXT7_API_KEY }}
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          # منبع کندل: بیت‌یونیکس پرپچوال، اسپات پشتیبان (دستور حمید؛ اثبات
          # رانر venue-probe کاوش ۷). ردپای candle_src روی هر سیگنال می‌نشیند.
          LIAM9_CANDLES: perp
        run: |
          set -o pipefail
          python3 -m hamid.cycle \
            --mode "${{ github.event.inputs.mode || 'auto' }}" \
            --symbols "${{ github.event.inputs.symbols || '200' }}" \
            | tee cycle.txt

      # رادار اردر بلاک (سند ۱۳ اوت): نقشهٔ کمترین و باکیفیت‌ترین OBها
      # قبل از رسیدن قیمت. رویداد داخلی است، سیگنال نیست — تلگرام ندارد.
      - name: رادار هوش اردر بلاک
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.ob_intel --symbols 40 || true

      # کارنامهٔ تجربه برای مصرف بیرونی (داشبورد حمید). سنجیده روی ۴۴۴
      # معاملهٔ سیگنال‌گرید: با تجربه ۸۶.۹٪ برد / +۰.۳۱۹R، بدون تجربه
      # ۶۷.۷٪ / +۰.۰۰۸R — قوی‌ترین عامل، پس باید بیرون هم در دسترس باشد.
      - name: انتشار کارنامهٔ تجربه
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.publish_experience || true

      # اثر تجربه روی نتیجه، با CI (دستور حمید ۲۳ اوت: «یادگیری و تجربه
      # چقدر تأثیر داشت؟»). عددی که راه بازتولید ندارد گزارش نمی‌شود.
      # پاک‌سازی تسویه‌های تکراری، **قبل از** هر آماری (رفع ۲۴ اوت).
      # ریشه بسته شد (ادغام بر هویت معامله + ردِ تسویهٔ دوباره در mark)،
      # ولی هر ردیفِ تکراریِ باقی‌مانده هنوز عدد را باد می‌کند. پشتیبان
      # کنار فایل ساخته می‌شود و gitignore جلوی کامیت شدنش را می‌گیرد.
      - name: پاک‌سازی تکرارِ دفتر بسته
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.dedupe_closed --apply || true

      - name: سنجهٔ اثر تجربه
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.experience_effect --days 7 || true

      # پالی‌مارکت (دستور حمید ۲۴ اوت): احتمالِ ضمنیِ پولِ واقعی + ردِ
      # پول بزرگ در برابر خرد، مقایسه با رژیم خودمان، و اثباتِ بازدید در
      # brain/research/polymarket/visits.jsonl. شاهد است، نه دروازه.
      - name: پیش‌بینی‌های پالی‌مارکت
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.polymarket || true

      # ماشین آستانه و ارجاع خودکار (دستور حمید ۲۵ اوت): استاپ پیاپی /
      # الگوی تکراری بین‌ارزی / کف نرخ برد → دستور کار مکتوب برای
      # اتاق‌های مسئول در signals/escalation.json + یک خبر کوتاه گیت‌دار.
      # فقط ارجاع می‌دهد؛ تصمیم و تغییر از مسیر یک-تغییر-در-چرخه.
      - name: ماشین آستانه (ارجاع خودکار)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.escalation || true

      # انتقال مهارت به داشبورد (دستور حمید ۲۴ اوت): قانون‌های CI-گذشتهٔ
      # بک‌تست شبانه → signals/edge.json → داشبورد با sync_all می‌کشد و
      # همان دلتاهای اندازه‌گیری‌شده را روی امتیازش می‌گذارد (سقف ±۱۵،
      # وتو نه). قفسهٔ کهنه‌تر از ۴۸ ساعت خودش را stale علامت می‌زند.
      - name: قفسهٔ لبه برای داشبورد
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.edge_export || true

      # امتیاز و وزن اتاق‌های ایجنت از عملکرد پیپرمود (دستور حمید ۲۷ اوت).
      # به تفکیک بسترِ بازار (ریزش/صعود USDT.D) شمرده می‌شود و داشبورد با
      # sync_all می‌کشد؛ سقف اثر ±۱۰ امتیاز، بدون هیچ وتویی.
      - name: وزن اتاق‌های ایجنت
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.agent_scores || true

      # شورای ققنوس (دستور حمید ۲ سپتامبر شب): کارنامهٔ ۱۲ مراقب زودیاک از
      # دفتر بسته + تابلوی وزن‌ها. مشاوره‌ای؛ دروازه نیست (قانون ۰۳).
      - name: کارنامهٔ شورای ققنوس
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.phoenix --score --write || true

      # اتاق توزیع اطلاعات (دستور ۳ سپتامبر): اول دسته‌بندی جهان نمادها،
      # بعد جدول مسیر رویداد→اتاق. تصمیم معاملاتی نمی‌گیرد.
      - name: اتاق توزیع اطلاعات (E27)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.router --write || true

      # بورد خبر (دستور ۳ سپتامبر): تابلوی مشترکِ همهٔ اتاق‌ها. دیدگاه است،
      # نه دروازه — قانون ۱۵.
      # شورای هر انجین (دستور ۳ سپتامبر): ۱۲ متخصص روی هر انجین، وزن به
      # تفکیک همان انجین. مشاوره‌ای — قانون ۰۳/۱۲.
      - name: شورای انجین‌ها (E00)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.council --score --write || true

      # دفتر مهارت (دستور ۳ سپتامبر): تجربهٔ تکراری ضریب می‌سازد نه ردیف.
      - name: دفتر مهارت (E21)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.skill_ledger --write || true

      - name: بورد خبر (E14)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.newsboard --write || true

      # اثباتِ یادگیری (E21). تا ۶ سپتامبر تنها تولیدکننده‌اش `liam9d.py`
      # بود — سرویس محلی لپ‌تاپ — و چون آن سرویس مستقر نیست، فایل ۲۴ ساعت
      # کهنه ماند و گذرگاه وضعیت DEGRADED می‌داد. علت، نه حادثه: فایلی که
      # پنل مصرفش می‌کند نباید تنها تولیدکننده‌اش چیزی باشد که اجرا
      # نمی‌شود. تا استقرار آن سرویس، Actions مرجع عملیاتی است (CLAUDE.md).
      # وقتی سرویس محلی مستقر شد، یکی از این دو نویسنده برداشته می‌شود
      # (قانون ۰۵: یک نویسنده برای هر دامنهٔ وضعیت).
      - name: اثباتِ یادگیری (E21)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.learning_proof --write || true

      # دفترِ ضدواقعیتِ دروازهٔ روند (دستور حمید ۶ سپتامبر). دروازه‌ای که
      # بیشترین شورت را می‌کشد تنها دروازه‌ای بود که کارنامه نداشت. این
      # قدم فقط **می‌خواند و داوری می‌کند** — هیچ آستانه‌ای عوض نمی‌شود.
      - name: داوری دروازهٔ روند (E17)
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.gate_verdict --write || true

      - name: نقشهٔ یکپارچگی سامانه (قانون ۱۳)
        run: python3 -m hamid.state_bus --write || true

      # گزارش کار (دستور حمید ۲۴ اوت: «تا گفتم گزارش کار را بده، نتایج را
      # با جزئیات و خلاصه و دقیق بهم بگو» → مهارت work-report). این‌جا هر
      # چرخه ساخته می‌شود تا وقتی حمید می‌پرسد، عددِ تازه از قبل روی
      # signals/work-report.json باشد و منتظر یک اجرای دستی نماند.
      - name: گزارش کار
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.work_report --hours 24 || true

      # لایهٔ نقدشوندگی برتر ۶۰ (دستور حمید، ۲۱ اوت: «همینو استراتژی کن»).
      # سنجیده روی dash-backtest واقعی: top60 CI[+0.199,+0.669] کاملاً بالای
      # صفر، رتبهٔ ۶۱+ هنوز صفر داخلش. از این پس liam9_strategy.analyze()
      # فقط برای همین لایه سیگنال می‌دهد؛ نبود این فایل تازه = بی‌سیگنالِ
      # کامل برای همهٔ آلت‌ها (قانون ۱)، نه عبور کور — پس این مرحله حیاتی
      # است و هر ۳۰ دقیقه باید تازه شود.
      - name: انتشار لایهٔ نقدشوندگی برتر ۶۰
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.publish_top_liquidity || true

      # نگهبان یکپارچگی (دستور حمید، ۲۰ اوت): «هیچ‌کس جز خودمان چیزی
      # این‌جا نگذارد». هر ورک‌فلوی تازه، نویسندهٔ ناشناس یا سکرت لو‌رفته
      # همین‌جا آلارم می‌شود؛ signals/sentinel.json با بقیهٔ خروجی چرخه
      # روی main می‌نشیند.
      - name: نگهبان یکپارچگی
        working-directory: claude-liam-signal/python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m hamid.sentinel --alert || true
      - name: پاسبان پوزیشن مانده (دستور ۲۳ اوت)
        if: always()
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.position_watch --alert || true

      - name: Summary
        if: always()
        working-directory: claude-liam-signal/python
        run: |
          { echo '```'; tail -60 cycle.txt 2>/dev/null || echo "no output"; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY

      # Always runs, guard or no guard. A publish step that is skipped by an
      # `if:` used to leave the next step without a git identity, which failed
      # with `fatal: empty ident name` and exit 128.
      - name: Git identity
        if: always()
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"

      # ناشر مشترک (۲ سپتامبر). تاریخچهٔ این گام همان تاریخچهٔ خرابی‌های
      # انتشار است: ۱۵ اوت `--ours` کور ۳۹۰ ردیف دفتر را برد؛ یک بار مارکر
      # تعارض در index.json منتشر شد و یادگیری ساعت‌ها خاموش ماند؛ ۲ سپتامبر
      # فایلِ بی‌handler حل‌کننده را کشت و ۸ ساعت هیچ انتشاری نشد. همهٔ این
      # قواعد حالا در scripts/publish.sh یک‌جا هستند و hamid/test_publish.py
      # هر کدام را در مخزن موقت بازسازی می‌کند.
      - name: Publish to main
        if: github.ref == 'refs/heads/main'
        run: scripts/publish.sh -m "Hamid cycle $(date -u '+%Y-%m-%d %H:%M') UTC" signals brain

      # پنل از gh-pages سرو می‌شود و فایل را نسبت به خودش می‌خواند. بدون این
      # مرحله، چرخه فقط روی main منتشر می‌شد و پنل حمید یک فایل ۳۹ ساعته
      # می‌دید — یعنی همهٔ این کار به دست کسی که باید ببیندش نمی‌رسید.
      - name: انتشار روی پنل
        id: ghp
        if: github.ref == 'refs/heads/main'
        run: |
          git fetch origin gh-pages
          rm -rf /tmp/ghp && git worktree add /tmp/ghp origin/gh-pages --detach
          # ── انتشار پنل: فهرست‌ها مشتق می‌شوند، دست‌نویس نیستند ──────────
          #
          # این مرحله سه بار یک عیب داد و هر بار وصلهٔ موضعی خورد:
          #   · ۲۷ اوت — `lightweight-charts.js` زیر /aura/ نبود → ۴۰۴؛
          #     چون sw.js از addAll اتمی استفاده می‌کند، همان یک ۴۰۴ کلِ
          #     کش را رد کرد و چارت بی‌صدا رندر نشد.
          #   · ۲ سپتامبر — پنج فایل signals در فهرست دست‌نویس نبودند →
          #     دو کارت پنل روی آدرس واقعی همیشه «هنوز ساخته نشده».
          #   · ۶ سپتامبر — **کل مقصد ریشه** ناشر نداشت → پنل حمید از
          #     ۱۸ اوت (۱۹ روز) همان بیلد قدیمی ماند، در حالی که
          #     `signals/` ریشه هر ۳ دقیقه تازه می‌شد: عددِ امروز در
          #     کارتِ ۱۸ اوت، بدون هیچ خطایی.
          #
          # علتِ مشترکِ هر سه، خودِ حادثه نیست: **فهرستِ دست‌نویس**. هر
          # دارایی تازه، هر کارت تازه و هر مقصد تازه باید در یک اسکریپت
          # شل به‌خاطر سپرده می‌شد؛ و اولین چیزی که آدم فراموش می‌کند
          # همین است. پس درمان، اضافه‌کردن یک `cp` دیگر نیست — برداشتنِ
          # حافظهٔ انسانی از این مسیر است:
          #
          #   ۱. مقصدها یک فهرست‌اند و حلقه می‌خورند (ریشه + /aura/)، پس
          #      هیچ مقصدی نمی‌تواند نیمه‌کاره بماند.
          #   ۲. دارایی‌های پنل از خودِ `index.html` استخراج می‌شوند.
          #   ۳. فهرست `signals/*.json` هم از خودِ `index.html` — پنل
          #      اعلام می‌کند چه می‌خواند، ما همان را می‌فرستیم.
          #   ۴. و در پایان **محصول** راستی‌آزمایی می‌شود نه اسکریپت:
          #      هشِ فایلِ منتشرشده باید با مبدأ یکی باشد. این تنها
          #      بررسی‌ای است که علتِ *بعدی* را هم می‌گیرد، بی‌آنکه لازم
          #      باشد از قبل حدسش بزنیم.
          #
          # /aura/ می‌ماند تا بوکمارک‌های قبلی نشکنند (یادگار دستور ۱۶ اوت،
          # از دورانی که این مخزن دو پنل داشت).
          PANEL_DESTS="/tmp/ghp /tmp/ghp/aura"
          ASSETS=$(grep -oE '(src|href)="\./[A-Za-z0-9_.-]+\.(js|png|webmanifest)"' index.html \
                   | sed -E 's/.*"\.\/(.*)"/\1/' | sort -u)
          ASSETS="$ASSETS sw.js manifest.webmanifest icon-192.png icon-512.png apple-touch-icon.png"
          WANTED=$(grep -oE '\./signals/[A-Za-z0-9_-]+\.json' index.html \
                   | sed -E 's#\./signals/##' | sort -u)
          echo "مقصدها: $PANEL_DESTS"
          echo "دارایی: $(echo $ASSETS | wc -w) فایل · signals: $(echo $WANTED | wc -w) فایل"
          for d in $PANEL_DESTS; do
            mkdir -p "$d/signals"
            cp index.html "$d/index.html"
            for a in $ASSETS; do cp "$a" "$d/" 2>/dev/null || true; done
            for f in $WANTED; do cp "signals/$f" "$d/signals/" 2>/dev/null || true; done
          done
          cd /tmp/ghp
          # `git add aura signals` بود — و دقیقاً به همین دلیل، وصلهٔ اولِ
          # ۶ سپتامبر کار نمی‌کرد: `index.html` ریشه کپی می‌شد و بعد
          # **هرگز stage نمی‌شد**. مسیرِ دست‌نویس، این‌بار در stage.
          git add -A
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "چرخهٔ حمید $(date -u '+%Y-%m-%d %H:%M') UTC"
          for a in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:gh-pages \
              && { echo "deployed=1" >> "$GITHUB_OUTPUT"; exit 0; }
            git fetch origin gh-pages || true
            git merge -X ours -m "ادغام gh-pages" origin/gh-pages || { git merge --abort 2>/dev/null || true; }
            sleep $((a * 4 + RANDOM % 7))
          done
          exit 1

      # ── راستی‌آزماییِ محصول، نه اسکریپت (رفعِ کلاس، ۶ سپتامبر) ──────────
      #
      # هر سه حادثهٔ این مرحله (۲۷ اوت، ۲ سپتامبر، ۶ سپتامبر) یک ویژگی
      # مشترک داشتند: **اسکریپت موفق بود، محصول غلط بود.** `cp` با
      # `|| true` سبز می‌ماند، `git add` مسیرِ نبوده را بی‌صدا رد می‌کند،
      # و آزمونِ متنِ ورک‌فلو هم فقط می‌گوید «این خط نوشته شده» نه «این
      # فایل واقعاً رسید».
      #
      # پس شرطِ پایانی روی خودِ چیزی است که منتشر شد: هشِ فایلِ روی
      # gh-pages باید بیت‌به‌بیت با مبدأ یکی باشد. این بررسی لازم نیست
      # علتِ بعدی را حدس بزند — هر علتی که پنل را کهنه کند، همین‌جا
      # قرمز می‌شود.
      - name: راستی‌آزمایی پنلِ منتشرشده
        if: always() && github.ref == 'refs/heads/main' && steps.ghp.conclusion == 'success'
        run: |
          set -o pipefail
          git fetch origin gh-pages
          SRC=$(git hash-object index.html)
          BAD=0
          for p in index.html aura/index.html; do
            GOT=$(git rev-parse "origin/gh-pages:$p" 2>/dev/null || echo "-")
            if [ "$GOT" = "$SRC" ]; then
              echo "✓ $p روی پنل با مبدأ یکی است ($SRC)"
            else
              echo "✗ $p روی پنل با مبدأ یکی نیست — مبدأ=$SRC منتشرشده=$GOT"
              BAD=1
            fi
          done
          SW=$(git hash-object sw.js)
          for p in sw.js aura/sw.js; do
            GOT=$(git rev-parse "origin/gh-pages:$p" 2>/dev/null || echo "-")
            [ "$GOT" = "$SW" ] || { echo "✗ $p کهنه است (کش بامپ‌نشده روی پنل)"; BAD=1; }
          done
          [ "$BAD" = "0" ] || {
            echo "پنلِ منتشرشده با مبدأ یکی نیست — همان کلاسِ عیبِ ۱۹روزهٔ ۶ سپتامبر"
            exit 1; }

      # (۱۷ اوت، ریپوی جدید) دیسپچ pages.yml برداشته شد: این‌جا Pages در حالت
      # «deploy از شاخهٔ gh-pages» است و هر پوش خودش همان لحظه دیپلوی می‌شود
      # (اندازه‌گیری‌شده: اجراهای «pages build and deployment» همه سبز)؛
      # دیپلوی artifact با آن مسیر تداخل داشت و هر بار قرمز می‌شد.

      # دیده‌بان، این بار بعد از انتشار — تنها جایی که مقایسهٔ پنل با آخرین
      # چرخه معنی دارد. همین‌جاست که اگر انتشار روی gh-pages بشکند، فوراً
      # معلوم می‌شود، نه یک روز و نیم بعد.
      - name: دیده‌بان پس از انتشار
        if: always() && github.ref == 'refs/heads/main'
        working-directory: claude-liam-signal/python
        env:
          WATCHDOG_AFTER_PUBLISH: "1"
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m hamid.watchdog --alert
