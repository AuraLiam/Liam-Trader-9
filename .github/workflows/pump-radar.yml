# زنجیرهٔ پیوستهٔ سیگنال — اسکن استراتژی + اتاق دامیننس + الگوهای BTC.
#
# (۲۰ اوت، دستور حمید — قانون ۰۷): رادار پامپ از این زنجیره خارج شد و به
# پنج نوبت روزانهٔ pump-review.yml رفت؛ اندازه‌گیری دفتر آلارم (n=۳۰۹۶،
# −۰.۱۸۰R، CI زیر صفر) نشان داد پامپ‌گردی پیوسته ارزش منفی داشت. نام فایل
# عمداً عوض نشد تا زنجیرهٔ self-dispatch و مدیک نشکنند.
#
# اندازه‌گیری ۱۰ اوت: کرون */5 گیت‌هاب در ساعت شلوغی اصلاً شلیک نشد (یک
# شکاف ۷۳ دقیقه‌ای ثبت شد). پس کادنس واقعی را نمی‌شود به کرون سپرد: خود
# job یک حلقهٔ ~۲۵ دقیقه‌ای است که ۸ دور می‌چرخد و در پایان، خودش را
# دوباره dispatch می‌کند — زنجیرهٔ پیوسته، مستقل از کرون. کرون و
# مدیک فقط تور ایمنی برای وقتی‌اند که زنجیره پاره شود.
#
# پوش ضدتصادم: قبل از هر تلاش، درخت به origin/main برمی‌گردد و خروجی‌های
# خودمان با --reapply دوباره می‌نشینند (آلارم‌ها merge، لاگ تلگرام اجتماع دو
# نسخه، دفتر تاریخچه اجتماع کامل).
name: Signal chain

on:
  schedule:
    # فقط تور ایمنی — سازوکار اصلی، زنجیرهٔ self-dispatch داخل خود job است
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      token:
        description: "توکن ربات (اگر Secret خالی است)"
        required: false
      chat_id:
        description: "شناسهٔ چت (اگر Secret خالی است)"
        required: false

permissions:
  contents: write
  actions: write        # dispatch بازانتشار Pages + زنجیرهٔ خودِ رادار

concurrency:
  group: pump-radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    timeout-minutes: 32
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      # ورودی dispatch هرگز از مسیر ${{ }} وارد env نمی‌شود — گیت‌هاب بلوک env
      # را در لاگ عمومی چاپ می‌کند و یک بار توکن همین‌طور افشا شد.
      - name: ماسک کردن ورودی‌ها
        run: |
          for f in token chat_id; do
            v=$(jq -r ".inputs.$f // empty" "$GITHUB_EVENT_PATH")
            [ -n "$v" ] && echo "::add-mask::$v"
          done
          true

      # زنجیره + کرونِ تور ایمنی می‌توانند هم‌زمان برسند؛ فقط یک حلقه بچرخد.
      - name: فقط یک حلقه
        id: guard
        run: |
          set -o pipefail
          n=$(curl -sf -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pump-radar.yml/runs?status=in_progress&per_page=10" \
            | jq --argjson me ${{ github.run_id }} '[.workflow_runs[] | select(.id != $me)] | length')
          if [ "${n:-0}" -gt 0 ]; then
            echo "حلقهٔ دیگری در حال چرخیدن است — این اجرا کنار می‌کشد"
            echo "skip=1" >> "$GITHUB_OUTPUT"
          fi

      - name: matplotlib برای چارت پیک و هشدار ریزش
        if: steps.guard.outputs.skip != '1'
        run: pip -q install matplotlib pyyaml

      - name: آزمون آفلاین
        id: selftest
        if: steps.guard.outputs.skip != '1'
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.test_pump_radar
          python3 -m hamid.test_pump_watchlist
          python3 -m hamid.test_dominance
          python3 -m hamid.test_dom_forecast
          python3 -m hamid.test_dom_decomp
          python3 -m hamid.test_dom_tf
          python3 -m hamid.test_direction_autopsy
          python3 -m hamid.test_fee_single_source
          python3 -m hamid.test_trend_gate_contract
          python3 -m hamid.test_short_lab
          python3 -m hamid.test_short_sampler
          python3 -m hamid.test_bandit
          python3 -m hamid.test_perp_source
          python3 -m hamid.test_engine_map
          python3 -m hamid.test_engine_dossier
          python3 -m hamid.test_scorecard
          python3 -m hamid.test_gainer_radar
          python3 -m hamid.test_curriculum
          python3 -m hamid.test_skeptic
          python3 -m hamid.test_trail_lab
          python3 -m hamid.test_trail_arms
          python3 -m hamid.test_pump_profile
          python3 -m hamid.test_patterns
          python3 -m hamid.test_orderblocks
          python3 -m hamid.test_ob_intel
          python3 -m hamid.test_deep
          python3 -m hamid.test_single_bot
          python3 -m hamid.test_state_bus
          python3 -m hamid.test_loop_audit
          python3 -m hamid.test_daily_24
          python3 -m hamid.test_fomo
          python3 -m hamid.test_news_poll
          python3 -m hamid.test_candle_source
          python3 -m hamid.test_phoenix
          python3 -m hamid.test_router
          python3 -m hamid.test_lines_wf
          python3 -m hamid.test_structure_room
          python3 -m hamid.test_newsboard
          python3 -m hamid.test_council
          python3 -m hamid.test_risk_desk
          python3 -m hamid.test_spec_check
          python3 -m hamid.test_dashboard_build
          python3 -m hamid.test_dash_silence
          python3 -m hamid.test_exec_feed
          python3 -m hamid.test_scan_breadth
          python3 -m hamid.test_strategy_priority
          python3 -m hamid.test_receipts_guard
          python3 -m hamid.test_learning
          python3 -m hamid.test_pump_study
          python3 -m hamid.test_workflows
          python3 -m hamid.test_pump_budget
          python3 -m hamid.test_sentinel
          python3 -m hamid.test_signal_flow
          python3 -m hamid.test_telegram_dedupe
          python3 -m hamid.test_fixit

      - name: حلقهٔ ۵ دقیقه‌ای (۵ دور در یک job)
        if: steps.guard.outputs.skip != '1'
        id: loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # منبع کندل: بیت‌یونیکس پرپچوال، اسپات پشتیبان (دستور حمید ۳۱ اوت/۲
          # سپتامبر؛ اثبات رانر: venue-probe کاوش ۷ — ۴۲۰ کندل سالم، بی‌شکاف).
          LIAM9_CANDLES: perp
        run: |
          export TELEGRAM_BOT_TOKEN="${TELEGRAM_BOT_TOKEN:-$(jq -r '.inputs.token // empty' "$GITHUB_EVENT_PATH")}"
          export TELEGRAM_CHAT_ID="${TELEGRAM_CHAT_ID:-$(jq -r '.inputs.chat_id // empty' "$GITHUB_EVENT_PATH")}"
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
          for k in 1 2 3 4 5 6 7 8; do
            t0=$(date +%s)
            echo "── دور $k از ۸ · $(date -u '+%H:%M:%S UTC') ──"
            # رادار پامپ این‌جا اجرا نمی‌شود (قانون ۰۷ — پنج نوبت روزانه در
            # pump-review.yml). reapply پایین می‌ماند چون دفترهای مشترک
            # (telegram-log، حافظه) را در پوش ضدتصادم اجتماع می‌کند.
            # درس ۲۵ اوت: عکس‌فوری‌هایی که این زنجیره خودش نمی‌سازد
            # (pump-radar.json، bubbles.json، pump-radar-sent.json) دیگر
            # بکاپ/بازنشانی نمی‌شوند — بکاپِ چک‌اوتِ کهنه ۱۳ ساعت خروجی
            # تازهٔ مرور پامپ را در هر کامیت زنجیره پس می‌زد (generated
            # ساعت ۰۸:۰۳ تا شب برمی‌گشت). فقط تولیدکننده بازنشانی می‌کند.

            # ثبت روی main (ضدتصادم)
            BK=/tmp/pump-radar-backup; mkdir -p "$BK"
            cp signals/telegram-log.json "$BK/" 2>/dev/null || true
            cp brain/pump-history.json "$BK/" 2>/dev/null || true
            cp brain/memory/lessons.json "$BK/" 2>/dev/null || true
            # دفتر انتظار پامپ — ۱۶ اوت، تشخیص پاسبان C3.
            # نبودنش این‌جا یک نامتقارنی ساخته بود که حافظهٔ دائمی را
            # می‌خورد: sweep() نمادِ منقضی را حذف می‌کرد و درسش را
            # می‌نوشت، بعد بازگشتِ درخت به origin/main دفتر را برمی‌گرداند
            # (نماد برمی‌گشت) ولی درس در reapply زنده می‌ماند. یعنی حذف
            # گم می‌شد و درس می‌ماند — و همان ۹ نماد هر ۳ دقیقه دوباره
            # «منقضی» می‌شدند. ۲۶ ساعت، ۱۹۷ درس تکراری از ۳۰۰.
            # (هر دو خط تولید مستقل به همین تشخیص رسیدند — اجتماعِ mergeِ ۱۷ اوت.)
            cp brain/pump-watchlist.json "$BK/" 2>/dev/null || true
            cp brain/pump-weakness-seen.json "$BK/" 2>/dev/null || true
            # کلاس عیب ۲۶ اوت شب (PAXG×۵): حافظهٔ ضدتکرار و دفترهای پیپر هم
            # باید از reset جان به در ببرند — وگرنه شکستِ push یعنی سیگنال
            # تکراری و پوزیشنِ گم‌شده (نتیجه/ریپلای هرگز نمی‌آید)
            cp signals/sent.json "$BK/" 2>/dev/null || true
            cp brain/paper/open.jsonl "$BK/" 2>/dev/null || true
            cp brain/paper/closed.jsonl "$BK/" 2>/dev/null || true
            for i in 1 2 3 4 5 6 7 8; do
              git fetch origin main -q
              git reset --hard origin/main -q
              (cd claude-liam-signal/python && python3 -m hamid.pump_radar --reapply "$BK")
              # بقای رسیدهای ارسال (رفع «رسید گم‌شدهٔ یونی»، ۳۰ اوت).
              # عکس‌فوریِ $BK قبل از اسکن گرفته می‌شود، پس رسیدهایی که خودِ
              # اسکن می‌سازد هرگز در آن نیستند؛ reset پاکشان می‌کرد و سیگنالِ
              # رفته بی‌پرونده می‌ماند. این‌جا با اجتماعِ هویت برمی‌گردند.
              (cd claude-liam-signal/python && python3 -m hamid.receipts_guard --restore "$BK") || true
              # دامیننس سوار همین زنجیره — کرون dominance.yml قحطی‌زده بود
              # (اندازه‌گیری: ۳۲ نقطه در ۳۲.۷ ساعت یعنی عملاً ساعتی، نه ۵دقیقه‌ای).
              # روی درخت تازهٔ origin/main اجرا می‌شود تا نقطهٔ جدید بی‌تصادم بنشیند.
              (cd claude-liam-signal/python && python3 -m hamid.dominance) || true
              # الگوهای BTC (۱س/۴س/۱روزه) و دامیننس — دستور حمید: پایش دائمی
              (cd claude-liam-signal/python && python3 -m hamid.btc_patterns) || true
              # نقشهٔ یکپارچگی سامانه (قانون ۱۳) — این‌جا و نه فقط در چرخهٔ
              # ۳۰دقیقه‌ای، چون خودِ نقشه سقف کهنگی ۴۵د دارد؛ اگر فقط جای
              # کم‌کادنس اجرا می‌شد، خودش آلارم کاذب تولید می‌کرد.
              (cd claude-liam-signal/python && python3 -m hamid.state_bus --write) || true
              # ممیزِ حلقهٔ بسته: هر سیگنالِ رفته باید رد پنل/یادگیری/علت داشته باشد
              (cd claude-liam-signal/python && python3 -m hamid.loop_audit --write) || true
              # کارنامهٔ انجین‌ها (دستور حمید ۳۱ اوت) — بعد از state_bus و
              # loop_audit، چون از خروجی همان‌ها می‌خواند. سقف کهنگی‌اش ۴۵د
              # است، پس باید در همین زنجیرهٔ */15 باشد نه جای کم‌کادنس‌تر.
              (cd claude-liam-signal/python && python3 -m hamid.scorecard --write) || true
              # رادار گینرهای بیت‌یونیکس (دستور حمید ۱ سپتامبر) — هر ۱۵
              # دقیقه فهرست گینرها را می‌گیرد، پول‌تازه را از شورت‌اسکوئیز
              # با جهتِ OI جدا می‌کند، و فقط ارزِ **تازه یا تغییرکرده** را
              # به تلگرام می‌دهد (ضداسپم داخل خودِ ماژول + دروازهٔ آلارم).
              (cd claude-liam-signal/python && python3 -m hamid.gainer_radar --write --telegram) || true
              # گزارش ساعتی دامیننس — از این‌جا هم تلاش می‌شود.
              #
              # ورک‌فلوی خودش کرون ساعتی دارد («19 * * * *») و هر ۲۲ اجرا
              # هم سبز بوده‌اند، ولی اندازه‌گیری ۱ سپتامبر نشان داد در ۶
              # روز فقط **۲۲ بار** فیره کرده — یعنی ~۳.۷ بار در روز به‌جای
              # ۲۴، با شکاف‌های تا ۸ ساعت و ۱۷ دقیقه. کرونِ Actions تضمینِ
              # اجرا نیست و نوبت‌ها را می‌اندازد. پس خرابی در ماژول نبود؛
              # در زمان‌بند بود.
              #
              # درمان: همین زنجیره که واقعاً هر چند دقیقه می‌دود، هر دور
              # تلاش می‌کند. ضدتکرارِ ۵۰دقیقه‌ایِ داخل خودِ ماژول
              # (`MIN_GAP_MIN`) کادنس را ساعتی نگه می‌دارد، پس «تلاش
              # مکرر» به «پیام مکرر» تبدیل نمی‌شود. ورک‌فلوی مستقل هم سر
              # جایش می‌ماند — هر کدام زودتر رسید، دیگری بی‌اثر می‌شود.
              # `--send` لازم است: بدون آن ماژول فقط چاپ می‌کند، نه
              # می‌فرستد و نه مهرِ وضعیت را تازه می‌کند — یعنی گامِ بی‌اثر.
              (cd claude-liam-signal/python && python3 -m hamid.dominance_report --send) || true
              # شکاک (دستور حمید ۱ سپتامبر) — بازجویی زنجیره از E01 تا
              # E25 با سؤال چرخشی. آخرِ همهٔ تولیدکننده‌ها اجرا می‌شود تا
              # خروجیِ تازهٔ همان دور را ببیند، نه دورِ قبل را.
              (cd claude-liam-signal/python && python3 -m hamid.skeptic --write --telegram) || true
              # حساسیت تاریخی به BTC (دستور ۲۹ اوت) — روزی یک بار کافی است.
              # سنِ فایل از **مهرِ خودش** خوانده می‌شود نه از mtime دیسک:
              # هر اجرا چک‌اوت تازه است، پس mtime همیشه «همین الان» است و
              # شرطِ `find -mmin +1200` هرگز درست نمی‌شد. اثرِ اندازه‌گیری‌شدهٔ
              # ۳۰ اوت: فایل ۲۴۸۵ دقیقه کهنه ماند و گذرگاه وضعیت DEGRADED
              # می‌داد. همان کلاسِ عیبِ live-scan — معیارِ غلط برای «کهنه».
              AGE_BS=$(python3 -c "import json,time;print(int((time.time()*1000-json.load(open('signals/btc-sensitivity.json'))['generated'])/60000))" 2>/dev/null || echo 999999)
              echo "btc-sensitivity age: ${AGE_BS}min"
              if [ "$AGE_BS" -gt 1200 ]; then
                (cd claude-liam-signal/python && python3 -m hamid.btc_sensitivity --write) || true
              fi
              # اسکن استراتژی‌ها هم سوار همین زنجیره — شکایت حمید (۱۲ اوت):
              # «همه سیگنال‌ها با هم می‌آیند». علت، اسکنِ دسته‌ایِ ~۲۰دقیقه‌ای
              # بود: هرچه در یک اجرا تأیید شده بود یک‌جا می‌رفت. حالا هر ۵
              # دقیقه اسکن می‌شود و سیگنال حداکثر یک کندل ۵د بعد از تأیید
              # می‌رود. اسکن فقط در تلاش اول اجرا می‌شود؛ در تلاش‌های بعدیِ
              # push خروجی‌هایش برگردانده و sent.json اجتماع می‌شود تا نه
              # سیگنالی دوباره برود نه دفتر ضدتکرار گم شود.
              if [ ! -f "/tmp/scan-done-$k" ]; then
                (cd claude-liam-signal/python && timeout 240 python3 scan.py --symbols 60 --rotate 200 --core 30 --telegram) || true
                touch "/tmp/scan-done-$k"
                cp signals/latest.json /tmp/scan-latest.json 2>/dev/null || true
                cp signals/sent.json /tmp/scan-sent.json 2>/dev/null || true
                # رسیدهای همین اسکن را کنار بگذار — تلاش‌های بعدیِ پوش
                # با reset پاکشان می‌کنند و بدون این، سیگنالِ رفته
                # بی‌پرونده می‌ماند (یونی، ۳۰ اوت ۱۲:۰۸)
                (cd claude-liam-signal/python && python3 -m hamid.receipts_guard --snapshot "$BK") || true
              else
                cp /tmp/scan-latest.json signals/latest.json 2>/dev/null || true
                (cd claude-liam-signal/python && python3 -m hamid.merge_sent /tmp/scan-sent.json ../../signals/sent.json) || true
              fi
              git add signals brain 2>/dev/null || true
              git diff --cached --quiet && { echo "چیزی برای ثبت نیست"; break; }
              git commit -q -m "زنجیرهٔ سیگنال $(date -u '+%Y-%m-%d %H:%M UTC')"
              git push origin HEAD:main -q && { echo "ثبت شد (تلاش $i)"; break; }
              sleep $((i * 4 + RANDOM % 7))
            done

            # انتشار روی پنل (gh-pages)
            if git fetch origin gh-pages -q; then
              rm -rf /tmp/ghp
              if git worktree add /tmp/ghp origin/gh-pages --detach -q; then
                mkdir -p /tmp/ghp/signals
                cp signals/pump-radar.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/bubbles.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/telegram-log.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/dominance.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/latest.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/btc-patterns.json /tmp/ghp/signals/ 2>/dev/null || true
                cp signals/funnel.json /tmp/ghp/signals/ 2>/dev/null || true
                ( cd /tmp/ghp
                  git add signals
                  if ! git diff --cached --quiet; then
                    git commit -q -m "زنجیرهٔ سیگنال $(date -u '+%H:%M') UTC"
                    for i in 1 2 3 4 5 6 7 8; do
                      git push origin HEAD:gh-pages -q \
                        && { echo "deployed=1" >> "$GITHUB_OUTPUT"; break; }
                      git fetch origin gh-pages -q || true
                      git merge -X ours -m "ادغام gh-pages" origin/gh-pages -q || { git merge --abort 2>/dev/null || true; }
                    done
                  fi )
                git worktree remove --force /tmp/ghp 2>/dev/null || true
              fi
            fi

            # آزمایش حمید (۱۳ اوت): گام ۳ دقیقه به‌جای ۵. اگر خودِ کار بیش از
            # ۱۸۰ ثانیه طول بکشد، حلقه بدون مکث پشت‌سرهم می‌چرخد — یعنی
            # سریع‌ترین کادنسی که این زیرساخت واقعاً می‌دهد؛ عددش از لاگ
            # قابل‌اندازه‌گیری است، نه از ادعا. (دور آخر صبر ندارد)
            if [ "$k" -lt 8 ]; then
              took=$(( $(date +%s) - t0 ))
              wait=$(( 180 - took )); [ "$wait" -lt 5 ] && wait=5
              echo "دور $k در ${took}ثانیه — ${wait}ثانیه تا دور بعد"
              sleep "$wait"
            fi
          done

      # (۱۷ اوت، ریپوی جدید) دیسپچ pages.yml برداشته شد: این‌جا Pages در حالت
      # «deploy از شاخهٔ gh-pages» است و هر پوش خودش همان لحظه دیپلوی می‌شود
      # (اندازه‌گیری‌شده: اجراهای «pages build and deployment» همه سبز)؛
      # دیپلوی artifact با آن مسیر تداخل داشت و هر بار قرمز می‌شد.

      # زنجیره: حلقهٔ بعدی را خودمان صدا می‌زنیم — کرون گیت‌هاب قابل اتکا نیست.
      #
      # **عقب‌گرد در برابر کرش‌لوپ (۲۳ اوت).** شرط قبلی `always()` بود، پس
      # زنجیره حتی وقتی دروازهٔ خودآزمایی خودش شکسته بود اجرای بعدی را صدا
      # می‌زد. ۲۳ اوت یک خط اشتباه در ورک‌فلوی عمق همین دروازه را قرمز کرد
      # و نتیجه ~۵۵۰ اجرای شکست‌خورده در ۸ ساعت شد (یک‌بار در دقیقه) که
      # ظرفیت رانر را بلعید و live-scan و scalp و shock-desk را هم از ۴
      # اجرا در ساعت به ۱ رساند. یعنی یک عیبِ کوچک، کل پنل را خواباند.
      #
      # حالا: اگر خودآزمایی شکست، زنجیرهٔ سریع **صدا زده نمی‌شود**. کرون
      # ربع‌ساعته و مدیک تور ایمنی‌اند — یعنی تلاش مجدد ۴ بار در ساعت
      # به‌جای ۶۰ بار. شکست همچنان دیده می‌شود (جاب قرمز است)، ولی دیگر
      # بقیهٔ سیستم را گروگان نمی‌گیرد.
      - name: بیدارکردن چرخه اگر گیت‌هاب زمان‌بندی‌اش را انداخته باشد
        if: always() && steps.guard.outputs.skip != '1'
        run: |
          # ریشهٔ اندازه‌گیری‌شدهٔ ۲۸ اوت: hamid-cycle کرون "17,47 * * * *"
          # دارد ولی اجراهای واقعی‌اش ۹ تا ۱۲ ساعت فاصله داشتند (۱۲:۱۴ ·
          # ۰۰:۲۶ · ۲۷ اوت ۱۵:۱۵). گیت‌هاب رویداد schedule را در ریپوی
          # پرمصرف می‌اندازد و خطایی هم ثبت نمی‌شود — همهٔ اجراها «موفق»اند،
          # فقط کمترند. نتیجه‌اش: لایهٔ یادگیری (experience، ob-radar،
          # sentinel) ۷.۵ ساعت کهنه ماند، یعنی تصمیم بعدی از رکورد به‌روز
          # نمی‌خواند — نقض تعهد ۲ قانون ۰۳.
          #
          # رفع: زنجیره که مطمئن اجرا می‌شود خودش چرخه را بیدار می‌کند،
          # ولی فقط وقتی خروجی چرخه واقعاً کهنه باشد — نه هر دور.
          AGE=$(python3 -c "import json,time; g=json.load(open('signals/hamid-latest.json')).get('generated') or 0; print(int((time.time()*1000-g)/60000))" 2>/dev/null || echo 9999)
          echo "سن خروجی چرخه: ${AGE} دقیقه"
          if [ "$AGE" -gt 60 ]; then
            curl -sf -X POST \
              -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/workflows/hamid-cycle.yml/dispatches" \
              -d '{"ref":"main"}' \
              && echo "چرخه بیدار شد (کهنگی ${AGE}د > ۶۰د)" \
              || echo "dispatch چرخه نشد — کرون خودش تلاش بعدی را می‌کند"
          else
            echo "چرخه تازه است — بیدارکردن لازم نیست"
          fi

      - name: زنجیرهٔ حلقهٔ بعد
        if: always() && steps.guard.outputs.skip != '1'
             && steps.selftest.outcome != 'failure'
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/pump-radar.yml/dispatches" \
            -d '{"ref":"main"}' \
            && echo "حلقهٔ بعد صدا زده شد" \
            || echo "dispatch نشد — کرون ربع‌ساعته و مدیک زنده‌اش می‌کنند"
