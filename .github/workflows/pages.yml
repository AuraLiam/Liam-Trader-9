# Publishes the panel to GitHub Pages from the default branch, taking the
# content from gh-pages. `configure-pages` with enablement turns Pages on
# through the API, so this needs no click in repository settings.
name: Deploy panel to Pages

on:
  workflow_dispatch:
  # کرون برداشته شد (۱۷ اوت، ریپوی جدید): Pages این‌جا در حالت «deploy از
  # شاخهٔ gh-pages» است و هر push خودش «pages build and deployment» را
  # می‌سازد (اندازه‌گیری‌شده: همه سبز). دیپلوی artifact این ورک‌فلو با همان
  # مسیر مسابقه می‌داد و شکست/کنسل قرمز می‌ساخت. مسیر کارکرده می‌ماند؛
  # این فایل فقط برای اجرای دستی اضطراری است.

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # محافظ (۱۷ اوت): اگر Pages در حالت «deploy از شاخه» است (build_type
      # legacy)، دیپلوی artifact این‌جا فقط با آن مسابقه می‌دهد و قرمز می‌شود.
      # در آن حالت، سبزِ بی‌کار درست است — پوش gh-pages خودش دیپلوی می‌کند.
      - id: mode
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          bt=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages" \
            | python3 -c "import json,sys; print(json.load(sys.stdin).get('build_type',''))" \
            || echo unknown)
          echo "build_type=$bt" >> "$GITHUB_OUTPUT"
          [ "$bt" = "legacy" ] && echo "Pages در حالت شاخه‌ای است — دیپلوی artifact لازم نیست" || true
      - uses: actions/checkout@v4
        if: steps.mode.outputs.build_type != 'legacy'
        with:
          ref: gh-pages
      - uses: actions/configure-pages@v5
        if: steps.mode.outputs.build_type != 'legacy'
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        if: steps.mode.outputs.build_type != 'legacy'
        with:
          path: .
      - id: deployment
        if: steps.mode.outputs.build_type != 'legacy'
        uses: actions/deploy-pages@v4
