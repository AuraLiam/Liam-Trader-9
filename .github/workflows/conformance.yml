# پاسبان نتیجه‌گیری‌ها — دستور حمید (۱۶ اوت): روتین تایمرداری که مرتب
# آخرین نتیجه‌گیری‌ها را با رفتار واقعی انجین‌ها می‌سنجد. فقط تخلف را
# گزارش می‌کند؛ سکوت یعنی همخوان.
name: Conclusions conformance

on:
  schedule:
    - cron: "29 */2 * * *"       # هر ۲ ساعت — هم‌قدم با آهنگ بازبینی دوساعته
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: conformance
  cancel-in-progress: false

jobs:
  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }

      - name: خودآزمایی
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_conformance

      - name: سنجش همخوانی
        working-directory: claude-liam-signal/python
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 -m hamid.conformance

      - name: کامیت گزارش
        # ۳۰ سپتامبر: ۱۱ اجرا در ۲۸ ساعت قرمز — حلقهٔ pushِ دست‌نویس بعد از ردشدن
        # push، rebase می‌کرد و روی «unstaged changes» می‌مرد. ناشر یگانه (قانون ۱۴).
        run: scripts/publish.sh -m "پاسبان نتیجه‌گیری‌ها $(date -u +'%H:%M UTC')" signals/conformance.json
