# شکار خبر — هر ۳ ساعت (خواستهٔ حمید): جستجوی عمیق وب + RSSها + تریدینگ‌ویو
# (خبر و تقویم رویدادها)، دسته‌بندی و مسیردهی به اتاق‌ها، و انتشار برای پنل.
#
# ۲ سپتامبر: + نظرسنجی خبر بین ایجنت‌ها (hamid/news_poll) — خبر فقط دیدگاه
# است؛ برداشت هر ایجنت ثبت و بعداً با کندل واقعی نمره می‌شود. روش llm فقط
# وقتی ANTHROPIC_API_KEY در Secrets باشد؛ بی‌کلید فقط خواننده‌های قطعی.
# ناشر: مشترک (قانون ۱۴).
name: News hunt

on:
  schedule:
    - cron: "37 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-hunt
  cancel-in-progress: false

jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: محیط مشترک
        run: pip -q install -r requirements-ci.txt
      - name: آزمون آفلاین
        env:
          LIAM9_SANDBOX: "1"
        working-directory: claude-liam-signal/python
        run: python3 -m hamid.test_news_poll
      - name: جمع‌آوری و دسته‌بندی
        working-directory: claude-liam-signal/python
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          python3 -m hamid.intel --deep --quiet
          python3 - <<'PY'
          import json, sys, time
          sys.path.insert(0, ".")
          from hamid import discovery
          d = json.load(open("../../brain/intel/latest.json"))
          hot = (d.get("news") or {}).get("hot") or []
          cls = discovery.classify_news(hot)
          out = {"generated": int(time.time() * 1000),
                 "verdict": d.get("verdict"),
                 "classified": cls[:10],
                 "calendar": (d.get("calendar") or {}).get("next_48h") or [],
                 "deep_topics": len(d.get("deep") or [])}
          open("../../signals/news.json", "w").write(
              json.dumps(out, ensure_ascii=False, indent=1))
          print(f"{len(hot)} تیتر داغ، {len(out['calendar'])} رویداد ۴۸س")
          PY
      - name: نظرسنجی خبر بین ایجنت‌ها
        working-directory: claude-liam-signal/python
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NEWS_POLL_MODEL: ${{ vars.NEWS_POLL_MODEL }}
        run: python3 -m hamid.news_poll
      - name: Git identity
        run: |
          git config user.name "Claude"
          git config user.email "noreply@anthropic.com"
      - name: ثبت روی main (ناشر مشترک، قانون ۱۴)
        run: scripts/publish.sh -m "شکار خبر $(date -u '+%H:%M') UTC" brain signals/news.json signals/news-poll.json
      - name: انتشار روی پنل
        run: |
          git fetch origin gh-pages -q || exit 0
          rm -rf /tmp/ghn
          git worktree add /tmp/ghn origin/gh-pages --detach -q || exit 0
          mkdir -p /tmp/ghn/signals /tmp/ghn/aura/signals
          for f in news news-poll; do
            cp "signals/$f.json" /tmp/ghn/signals/ 2>/dev/null || true
            cp "signals/$f.json" /tmp/ghn/aura/signals/ 2>/dev/null || true
          done
          cd /tmp/ghn
          git add signals aura
          if ! git diff --cached --quiet; then
            git commit -q -m "شکار خبر $(date -u '+%H:%M') UTC"
            for i in 1 2 3 4 5 6 7 8; do git push origin HEAD:gh-pages -q && break; git fetch origin gh-pages -q||true; git merge -X ours -m "ادغام gh-pages" origin/gh-pages -q||{ git merge --abort 2>/dev/null||true; }; done
          fi
