# میز شوک — قانون حمید ۱۹ اوت: شوک بیت‌کوین روی هر تایم → اردر بلاک با
# اهرم ۵–۶، و شکار پامپ با اهرم ۱۵ فقط با تأیید حجمی ۱۰۰٪.
#
# ⏹ خاموش شد — دستور صریح حمید، ۲۴ اوت.
#
# معیارِ خاموشی همان چیزی است که قانون ۱۹ اوت خودش گذاشته بود: «تا وقتی
# بازهٔ اطمینانش از صفر رد نشود، فقط پیپر». بعد از **۳٬۱۶۳ معامله** رد
# نکرد:
#     ناخالص  +۰.۰۸۲R  CI95 [+۰.۰۴۸, +۰.۱۱۶]   ← لبه واقعی است
#     خالص    −۰.۰۳۱R  CI95 [−۰.۰۶۵, +۰.۰۰۵]   ← کارمزد تمامش را می‌خورد
#     جمع خالص: −۹۹.۰R
#
# نکتهٔ مهم برای هرکسی که بعداً این را روشن می‌کند: فرضیهٔ شوک **باطل
# نشد**. لبهٔ ناخالصش با CI بالای صفر است. چیزی که شکست، هندسه‌اش بود —
# استاپ آن‌قدر تنگ که کارمزد (`کارمزد٪ ÷ استاپ٪`) کل لبه را می‌بلعد.
# همان بیماریِ اسکلپ ۱ دقیقه. روشن‌کردنِ دوباره فقط با هندسهٔ بزرگ‌تر
# معنا دارد، نه با همین پارامترها.
#
# کد و آزمون‌ها (liam9_shock.py · hamid/shock_desk.py · test_shock.py با
# ۴۶ آزمون) دست‌نخورده می‌مانند و `workflow_dispatch` سرِ جایش است، تا
# اجرای دستی و بازآزمایی ممکن بماند. فقط کرون برداشته شد.
name: Shock desk

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shock-desk
  cancel-in-progress: false

jobs:
  shock:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Self-test
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.test_shock
          python3 -m hamid.test_exec_contract
      - name: Run shock desk
        working-directory: claude-liam-signal/python
        env:
          # کلید امضای خط زنده — فقط از سکرت، هرگز در کد یا لاگ.
          LIAM9_LINK_SECRET: ${{ secrets.LIAM9_LINK_SECRET }}
        run: python3 -m hamid.shock_desk
      # پل اسکلپ→داشبورد (دستور حمید ۱۹ اوت): ستاپِ مناسبِ اسکلپ فوری
      # به سفارش فیوچرز امضاشده تبدیل می‌شود. mode=demo؛ پول واقعی فقط با
      # LIAM9_ALLOW_LIVE=1 روی ماشین خود حمید.
      - name: پل اجرا به داشبورد
        working-directory: claude-liam-signal/python
        env:
          LIAM9_LINK_SECRET: ${{ secrets.LIAM9_LINK_SECRET }}
        run: python3 -m hamid.scalp_exec --mode demo || true
      - name: Publish
        run: |
          set -o pipefail
          git config user.name "Hamid Signal Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A brain/paper signals
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "میز شوک $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && break
            git fetch origin main || true
            if ! git merge --no-edit origin/main; then
              python3 "$GITHUB_WORKSPACE/scripts/resolve_brain_conflicts.py" \
                || { git merge --abort; exit 1; }
              git commit --no-edit || { git merge --abort; exit 1; }
            fi
            sleep $((attempt * 4 + RANDOM % 7))
          done
      - name: Publish to panel (gh-pages)
        run: |
          set -o pipefail
          git fetch origin gh-pages
          rm -rf /tmp/ghp && git worktree add /tmp/ghp origin/gh-pages --detach
          mkdir -p /tmp/ghp/signals
          for f in shock live-link link-commands scalp-exec; do
            cp "signals/$f.json" /tmp/ghp/signals/ 2>/dev/null || true
          done
          cd /tmp/ghp
          git add signals
          git diff --cached --quiet && { echo "unchanged"; exit 0; }
          git commit -q -m "شوک $(date -u '+%H:%M') UTC"
          for a in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:gh-pages && exit 0
            git fetch origin gh-pages || true
            git merge -X ours -m "ادغام gh-pages" origin/gh-pages || { git merge --abort 2>/dev/null || true; }
            sleep $((a * 4 + RANDOM % 7))
          done
          exit 1
