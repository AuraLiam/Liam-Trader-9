# بک‌تست میز اسکلپ ۱ دقیقهٔ داشبورد (E08 اردر بلاک + E09 هندسهٔ کندل) روی
# کندل واقعی. دستور حمید (۲۰ اوت): اسکلپ به داشبورد اضافه شد، این دو انجین
# باید نتیجه‌شان با عدد سنجیده شود. محاسبهٔ سنگین روی Actions، نه نشست.
name: Scalp dash backtest

on:
  workflow_dispatch:
    inputs:
      symbols:
        description: "چند نماد"
        default: "60"
      bars:
        description: "چند کندل ۱ دقیقه (سقف صرافی‌ها معمولاً ~۱۰۰۰)"
        default: "1000"
      strategy_ref:
        description: "A/B هم‌پنجره: نسخهٔ قدیمی liam9_strategy.py از این کامیت (خالی = نسخهٔ فعلی)"
        default: ""
      publish:
        description: "نتیجه روی ریپو ثبت شود؟ (برای A/B خالی بگذارید = no)"
        default: "yes"
  schedule:
    - cron: "37 4 * * *"        # روزی یک بار، دقیقهٔ فرد (کرون */N ممنوع)

permissions:
  contents: write

concurrency:
  group: scalp-dash-backtest
  cancel-in-progress: false

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Self-test
        working-directory: claude-liam-signal/python
        run: |
          python3 -m hamid.test_scalp_dash_backtest
          python3 -m hamid.test_exec_contract
      # A/B هم‌پنجره: بک‌تستِ دو نسخه در دو زمانِ مختلف قابل مقایسه نیست —
      # تختهٔ بازار عوض می‌شود و بهبودِ ظاهری می‌تواند فقط تختهٔ مهربان‌تر
      # باشد (این اشتباه قبلاً در همین پروژه رخ داده). این گام فقط فایل
      # استراتژی را به نسخهٔ قدیمی برمی‌گرداند تا هر دو روی *همین* پنجره
      # سنجیده شوند. بقیهٔ خط لوله (و منطق امنِ انتشار) از main می‌ماند.
      - name: Old strategy version for same-window A/B
        if: github.event.inputs.strategy_ref != ''
        run: |
          set -e
          git checkout "${{ github.event.inputs.strategy_ref }}" -- \
            claude-liam-signal/python/liam9_strategy.py
          echo "نسخهٔ زیر آزمایش می‌شود:"
          grep -m2 -n '"version"' claude-liam-signal/python/liam9_strategy.py
      - name: Backtest on real candles
        working-directory: claude-liam-signal/python
        run: |
          set -o pipefail
          python3 -m hamid.scalp_dash_backtest \
            --symbols "${{ github.event.inputs.symbols || '60' }}" \
            --bars "${{ github.event.inputs.bars || '1000' }}" | tee scalp-dash.txt
      - name: Summary
        if: always()
        working-directory: claude-liam-signal/python
        run: |
          { echo '```'; tail -30 scalp-dash.txt 2>/dev/null || echo "no output"; echo '```'; } \
            >> $GITHUB_STEP_SUMMARY
      - name: Publish
        if: github.event.inputs.publish != 'no' && github.event.inputs.strategy_ref == ''
        run: |
          git config user.name "Hamid Signal Agent"
          git config user.email "actions@users.noreply.github.com"
          git add -A signals
          git diff --cached --quiet && { echo "بدون تغییر"; exit 0; }
          git commit -q -m "بک‌تست اسکلپ داشبورد $(date -u '+%Y-%m-%d %H:%M') UTC"
          for attempt in 1 2 3 4 5 6 7 8; do
            git push origin HEAD:main && exit 0
            git fetch origin main || true
            # `--allow-unrelated-histories`: این ریپو واقعاً **دو ریشه** دارد
            # (`git rev-list --max-parents=0` دو کامیت می‌دهد)، پس گیت گاهی
            # «refusing to merge unrelated histories» می‌دهد و آن‌وقت هیچ
            # merge ای در جریان نیست.
            if ! git merge --no-edit --allow-unrelated-histories origin/main; then
              python3 "$GITHUB_WORKSPACE/scripts/resolve_brain_conflicts.py" || true
              # حل‌شده‌ها باید stage شوند، وگرنه commit «چیزی برای کامیت
              # نیست» می‌دهد و دور بعد هم همان.
              git add -A brain signals 2>/dev/null || true
              # هر پاک‌سازی با `|| true`: زیر `bash -e` خطای کشندهٔ
              # `git merge --abort` (وقتی merge ای در جریان نیست) کلِ گام
              # را در **دور اول** می‌کشت و حلقهٔ ۸تایی هرگز دور دوم
              # نمی‌دید. اثبات: اجرای ۳۲۰ چرخه، exit 128 در ۳ ثانیه.
              git commit --no-edit || git merge --abort || true
            fi
            sleep $((attempt * 4 + RANDOM % 7))
          done
          exit 1
